name: Build Mod
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  MC_VERSION: 1.20.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean & Build (Fabric + Forge双端打包)
        run: ./gradlew clean build --no-daemon

      - name: Upload compiled JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-build-jars
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-dev.jar
            !**/build/libs/*-sources.jar

      - name: Upload test reports (构建失败时保留日志)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: **/build/reports/
