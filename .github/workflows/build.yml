name: Cloud Build Mod
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: 17

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Gradle clean build
        run: ./gradlew clean build --no-daemon --console=plain

      # 新建release文件夹，只复制不带-dev的正式jar
      - name: Pick release jars (skip -dev)
        run: |
          mkdir -p release
          find animationdirector/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" -exec cp {} release/ \;
          find needsofnature/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" -exec cp {} release/ \;
          ls -la release/

      # 只上传release目录，这里面只有正式包
      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod-release-jars
          path: release/

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-reports
          path: "**/build/reports/"
