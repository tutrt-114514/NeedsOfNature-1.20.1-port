name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod jar
        run: ./gradlew jar

      # 查找全部jar，打印路径用于日志排查
      - name: Find all jar files
        run: find . -name "*.jar"

      # 只上传 build/libs 里不带-dev后缀的成品jar，排除dev调试包
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-output
          path: build/libs/!(*dev).jar

