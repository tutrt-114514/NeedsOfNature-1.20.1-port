name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod jar
        run: ./gradlew jar

      # 列出所有jar，方便看生成了哪些
      - name: Find all jar files
        run: find build/libs -name "*.jar"

      # 复制所有不带-dev的jar到临时文件夹upload，dev包不复制
      - name: Copy release jars (exclude dev)
        run: |
          mkdir -p upload
          find build/libs -type f -name "*.jar" ! -name "*dev*.jar" -exec cp {} upload/ \;

      # 上传临时文件夹里的成品jar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-output
          path: upload/
