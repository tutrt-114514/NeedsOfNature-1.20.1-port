name: Cloud Build Mod
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: # 支持网页手动点击运行，无需提交代码

env:
  JAVA_VERSION: 17

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 云端执行完整构建，等价本地 ./gradlew clean build --no-daemon
      - name: Gradle clean build
        run: ./gradlew clean build --no-daemon --console=plain

      # 上传编译产物到Action构件页面，网页可以直接下载jar
      - name: Save build JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled‑mod‑jars
          path: |
            animationdirector/build/libs/*.jar
            needsofnature/build/libs/*.jar
          exclude: |
            **/*‑dev.jar
            **/*‑sources.jar
            **/*‑test.jar

      # 构建失败保存报告排错
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build‑error‑reports
          path: "**/build/reports/"
