name: Cloud Build Mod
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  # 构建运行环境使用JDK21（满足Loom1.17.14要求）
  JAVA_VERSION: 21
  # 编译输出字节码目标依旧是Java17，兼容MC1.20.1
  TARGET_JAVA: 17

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Gradle clean build
        run: ./gradlew clean build --no-daemon --console=plain

      # 筛选，只复制不带-dev的正式发布jar
      - name: Pick release jars (skip -dev)
        run: |
          mkdir -p release
          find animationdirector/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" -exec cp {} release/ \;
          find needsofnature/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" -exec cp {} release/ \;
          ls -la release/

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod-release-jars
          path: release/

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-reports
          path: "**/build/reports/"
