name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod jar
        run: ./gradlew jar

      # 全局查找所有jar，打印全部路径，不再限定build/libs
      - name: Find all jar files
        run: find . -name "*.jar"

      # 新建upload文件夹，复制所有不含-dev的jar
      - name: Copy release jars (exclude dev)
        run: |
          mkdir -p upload
          find . -type f -name "*.jar" ! -name "*dev*.jar" -exec cp {} upload/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-output
          path: upload/
